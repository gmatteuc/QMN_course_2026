# Course-wide conda environment for
# "Quantitative Methods in Neuroscience" (Master in Neuroscience, UniGe, 2026-27).
#
# Create the environment once, then re-use it for every weekly notebook:
#
#     conda env create -f environment.yml
#     conda activate qmn
#
# To update it later (e.g. after we add a new package for a later week):
#
#     conda env update -f environment.yml --prune
#
# Versions are deliberately left open while the notebooks are still being
# written. Once the weekly notebooks are final this file gets pinned to the
# exact versions we tested against, so that every student builds the same
# environment and the practicals behave the same way on every laptop.

name: qmn
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Core scientific stack
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  # Statistics / modelling
  - statsmodels
  - scikit-learn
  # Tidy stats front-end: t-tests, ANOVA, repeated measures and post-hoc
  # tests with readable output tables. Added for the ANOVA week; that week
  # currently uses statsmodels instead, so this stays only if Week 5 adopts it.
  - pingouin
  # EEG. Both EEG datasets ship as plain .npz files that load with numpy alone,
  # so this is needed only for the scalp topographies in Notebook 11. mne-base
  # is the light build: no 3D rendering stack, which is what makes MNE heavy.
  - mne-base
  # Notebooks
  - jupyterlab
  - ipykernel
  - ipywidgets
  # Git hygiene. Notebook outputs are deliberately kept in the repository while
  # the material is being written, so the filter is not active: see the comment
  # in .gitattributes. It is kept here for the final pass, when the student
  # repository is generated and outputs are stripped.
  - nbstripout
